services:
  - type: web
    name: aquasentinel-api
    runtime: docker
    rootDir: services/api
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_HOST
        value: 0.0.0.0
      - key: APP_PORT
        value: 8000
    healthCheckPath: /health
